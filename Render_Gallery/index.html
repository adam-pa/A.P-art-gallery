<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Renders</title>
  <style>
    
    :root{
      --bg:#0a0a0a; --card:#121526; --ink:#fff; --ink-dim:#a5a5a5; --hover:#1f1f1f; --border:#292929;
      --radius:12px;
    }
    *{box-sizing:border-box}

    body {
      margin: 0; 
      padding: 0px; 
      background: var(--bg); 
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column; 
      align-items: center;   
      min-height: 100vh; 
    }
    .main-content {
      flex: 1; 
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    } 

    .header-section {
        width: 100%;
        padding: 40px 20px;
        text-align: center;
        background: linear-gradient(rgba(10, 10, 10, 0.7), rgba(10, 10, 10, 0.7)), url('Renders/56.jpg');
        background-size: cover;
        background-position: center;
        border-bottom-style: solid;
        border-width: 2px;
        border-color: var(--border);  
    }
    .header-section a {
        text-decoration: none;
    }

    .footer-section {
        width: 100%;
        padding: 80px 20px;
        text-align: center;
        background: linear-gradient(rgba(10, 10, 10, 0.7), rgba(10, 10, 10, 0.7)),  url('Renders/56.jpg');
        background-size: cover;
        background-position: center;
        border-top-style: solid;
        border-width: 2px;
        border-color: var(--border);
  
    }
    .spacer-line {
        width: 100%;     
        border: none;
        border-top: 0px solid var(--border);
        margin: 20px 0;  
    }
    

    h1{ 
      margin:0 0 6px 0;   
      font-weight:100; 
      font-size: 60px;
      letter-spacing:.2px; 
    }

    .subtitle{ 
      margin:1; 
      color:var(--ink-dim); 
      font-size:20px; 
      font-weight:100; 
      text-decoration: none;
    }

    .gallery-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 90%;
    }

    .gallery-card {
      display: flex;
      justify-content: center;

    }

    .gallery-card a {
      display: inline-block;
      border: 2px solid var(--border);
      border-radius: 12px; 
      padding: 10px;
      background: none;
      transition: background 0.3s ease;
      line-height: 0; 
    }

    .gallery-card a:hover {
      background: var(--hover);
    }

    .gallery-card img {
      display: block;
      width: 100%;     
      aspect-ratio: 1 / 1; 
      object-fit: cover;
      object-position: center;
      border: none;
      border-radius: 8px;
    }
    .gallery-card a {
      font-size: 20px;
      margin: 0;

    }

  </style>
</head>

<body>
    <div class="header-section">
        <h1>My Renders</h1>
        <a href="../index.html">
          <span class="subtitle", >← Back to Home</span> 
        </a>
    </div>

    <div class="main-content">
      <hr class = "spacer-line">
      <div id="gallery-list" class="gallery-list"></div>
      <script>

          function loadGallery() {
              const galleryContainer = document.getElementById('gallery-list');
              const folderPath = 'Renders/';

              files.reverse().forEach((fileName) => {
                  const fileNumber = fileName.split('.')[0];
                  
                  const card = document.createElement('div');
                  card.className = 'gallery-card';
                  card.innerHTML = `
                      <a href="${folderPath}${fileName}">
                          <img src="${folderPath}${fileName}" alt="${fileName}">
                      </a>
                  `;
                  galleryContainer.appendChild(card);
              });
          }

          loadGallery();
      </script>
      <hr class = "spacer-line">
    </div>
    
    <div class="footer-section">
        <span class="subtitle">Copyright © 2026 Adam P. All rights reserved.</span> 
    </div>
  
</body>

</html>
