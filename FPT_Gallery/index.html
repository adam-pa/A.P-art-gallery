<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My FPT Gallery</title>
  <style>
    
    :root{
      --bg:#0a0a0a; --card:#121526; --ink:#fff; --ink-dim:#a5a5a5; --hover:#1f1f1f; --border:#292929;
      --radius:12px;
    }
    *{box-sizing:border-box}

    body {
        margin: 0; 
        padding: 0px; 
        background: var(--bg); 
        color: var(--ink);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column; 
        align-items: center;    
    }
    .header-section {
        width: 100%;
        padding: 40px 20px;
        text-align: center;
        background: linear-gradient(rgba(10, 10, 10, 0.7), rgba(10, 10, 10, 0.7)), url('Renders/44.png');
        background-size: cover;
        background-position: center;
        border-bottom-style: solid;
        border-width: 2px;
        border-color: var(--border);  
    }
    .header-section a {
        text-decoration: none;
    }

    .footer-section {
        width: 100%;
        padding: 80px 20px;
        text-align: center;
        background: linear-gradient(rgba(10, 10, 10, 0.7), rgba(10, 10, 10, 0.7)),  url('Renders/44.png');
        background-size: cover;
        background-position: center;
        border-top-style: solid;
        border-width: 2px;
        border-color: var(--border);
  
    }
    .spacer-line {
        width: 100%;     
        border: none;
        border-top: 0px solid var(--border);
        margin: 20px 0;  
    }
    

    h1{ 
      margin:0 0 6px 0;   
      font-weight:100; 
      font-size: 60px;
      letter-spacing:.2px; 
    }

    .subtitle{ 
      margin:1; 
      color:var(--ink-dim); 
      font-size:20px; 
      font-weight:100; 
      text-decoration: none;
    }

    .gallery-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 90%;
    }

    .gallery-card {
      display: flex;
      justify-content: center;

    }

    .gallery-card a {
      display: inline-block;
      border: 2px solid var(--border);
      border-radius: 12px; 
      padding: 10px;
      background: none;
      transition: background 0.3s ease;
      line-height: 0; 
    }

    .gallery-card a:hover {
      background: var(--hover);
    }

    .gallery-card img {
      display: block;
      width: 100%;     
      aspect-ratio: 1 / 1; 
      object-fit: cover;
      object-position: center;
      border: none;
      border-radius: 8px;
    }
    .gallery-card a {
      font-size: 20px;
      margin: 0;

    }

  </style>
</head>

<body>
    <div class="header-section">
        <h1>FPT</h1>
        <a href="../index.html">
          <span class="subtitle", >← Back to Home</span> 
        </a>
    </div>
    <hr class = "spacer-line">

    <div id="gallery-list" class="gallery-list"></div>
    <script>
        const files = [
                      "1.png",
                      "2.png",
                      "3.png", 
                      "4.png",
                      "5.png",
                      "6.png",
                      "7.png",
                      "8.png",
                      "9.png",
                      "10.png",
                      "12.png",
                      "13.png",
                      "14.png",
                      "15.png",
                      "16.png",
                      "17.png",
                      "18.png",
                      "19.png",
                      "20.png",
                      "21.png",
                      "22.png",
                      "23.png",
                      "24.png",
                      "25.png",
                      "26.png",
                      "27.png",
                      "28.png",
                      "29.png",
                      "30.png",
                      "31.png",
                      "32.png",
                      "33.png",
                      "34.png",
                      "35.png",
                      "36.png",
                      "37.png",
                      "38.png",
                      "39.png",
                      "40.png",
                      "41.png",
                      "42.png",
                      "43.png",
                      "44.png",
                      
                    
                      ]; 

        function loadGallery() {
            const galleryContainer = document.getElementById('gallery-list');
            const folderPath = 'Renders/';

            files.reverse().forEach((fileName) => {
                const fileNumber = fileName.split('.')[0];
                
                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.innerHTML = `
                    <a href="${folderPath}${fileName}">
                        <img src="${folderPath}${fileName}" alt="${fileName}">
                    </a>
                `;
                galleryContainer.appendChild(card);
            });
        }

        loadGallery();
    </script>
    <hr class = "spacer-line">
    <div class="footer-section">
        <span class="subtitle">Copyright © 2026 Adam P. All rights reserved.</span> 
    </div>
  
</body>

</html>
